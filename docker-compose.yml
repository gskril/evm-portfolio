services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8580:8580' # Client port
    volumes:
      - sqlite_data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    command: bun run start
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const response = await fetch('http://127.0.0.1:8580/'); process.exit(response.ok ? 0 : 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 1s
    restart: unless-stopped

volumes:
  redis_data:
  sqlite_data:
